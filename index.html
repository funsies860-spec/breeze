let cart = [];

// Navigation & View Routing
function showView(viewName) {
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('collection-view').style.display = 'none';
  document.getElementById('product-detail-view').style.display = 'none';
  document.getElementById('checkout-view').style.display = 'none';
  
  const customView = document.getElementById('custom-order-view');
  if (customView) customView.style.display = 'none';

  if (viewName === 'collection') {
    document.getElementById('collection-view').style.display = 'block';
    renderCollection();
  } else if (viewName === 'product-detail') {
    document.getElementById('product-detail-view').style.display = 'block';
  } else if (viewName === 'checkout') {
    document.getElementById('checkout-view').style.display = 'block';
    renderCheckoutSummary();
  } else if (viewName === 'custom-order') {
    if (customView) customView.style.display = 'block';
  } else {
    document.getElementById('home-view').style.display = 'block';
  }
  window.scrollTo(0, 0);
}

// Custom Order Toggle & Addition
function toggleOtherInput() {
  const select = document.getElementById('co-piece-type');
  const wrapper = document.getElementById('co-other-wrapper');
  const otherInput = document.getElementById('co-other-type');

  if (!select || !wrapper || !otherInput) return;

  if (select.value === 'Other') {
    wrapper.style.display = 'block';
    otherInput.required = true;
  } else {
    wrapper.style.display = 'none';
    otherInput.required = false;
  }
}

function addCustomToCart(event) {
  event.preventDefault();

  const pieceTypeSelect = document.getElementById('co-piece-type').value;
  const otherType = document.getElementById('co-other-type').value.trim();
  const description = document.getElementById('co-description').value.trim();
  const material = document.getElementById('co-material').value;

  const pieceName = pieceTypeSelect === 'Other' ? otherType : pieceTypeSelect;

  const customProduct = {
    id: 'custom-' + Date.now(),
    name: `Custom: ${pieceName}`,
    price: "TBD",
    tag: material,
    description: description,
    quantity: 1,
    svg: `<svg viewBox="0 0 200 200" width="70%" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="60" stroke="#1D3156" stroke-width="2" stroke-dasharray="6 6"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="#1D3156" font-family="sans-serif" font-size="14">Custom</text></svg>`
  };

  cart.push(customProduct);
  updateCartUI();

  document.getElementById('custom-order-form').reset();
  toggleOtherInput();
  toggleCart();
}

// Product Rendering & Details
function renderCollection() {
  const gridContainer = document.getElementById("product-grid");
  if (!gridContainer || gridContainer.children.length > 0) return;

  gridContainer.innerHTML = products.map(product => {
    const mediaHtml = (product.images && product.images.length > 0)
      ? `<img src="${product.images[0]}" alt="${product.name}" class="piece-img" style="width: 100%; height: 100%; object-fit: cover;" />`
      : product.svg;

    const displayPrice = typeof product.price === 'number' ? `$${product.price}` : product.price;
    const displayTag = product.material || product.tag || '';

    return `
      <div class="piece-card" onclick="openProductDetail(${product.id})" style="cursor: pointer;">
        <div class="piece-art">
          ${mediaHtml}
        </div>
        <div class="piece-meta">
          <div>
            <p class="piece-name">${product.name}</p>
            <p class="piece-tag">${displayTag}</p>
          </div>
          <p class="piece-price">${displayPrice}</p>
        </div>
      </div>
    `;
  }).join('');
}

function openProductDetail(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;

  // 1. Populate text fields
  document.getElementById('detail-name').textContent = product.name;
  document.getElementById('detail-price').textContent = typeof product.price === 'number' ? `$${product.price}` : product.price;
  document.getElementById('detail-material').textContent = product.material || product.tag || '';
  document.getElementById('detail-description').textContent = product.description;

  const storyEl = document.getElementById('detail-story');
  if (storyEl) {
    storyEl.textContent = product.story || product.description;
  }

  // 2. Render Media (Images Slider or SVG fallback)
  const mediaContainer = document.getElementById('detail-media');
  if (mediaContainer) {
    if (product.images && product.images.length > 0) {
      mediaContainer.style.padding = '0';
      mediaContainer.style.margin = '0';
      mediaContainer.style.background = '#0a0a0a';
      mediaContainer.style.overflow = 'hidden';
      mediaContainer.style.borderRadius = '16px';
      mediaContainer.style.width = '100%';
      mediaContainer.style.height = 'auto';
      mediaContainer.style.minHeight = 'unset';

      mediaContainer.innerHTML = `
        <div style="width: 100%; position: relative;">
          <div id="detail-slider" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; scrollbar-width: none;">
            ${product.images.map((imgUrl, index) => `
              <img 
                src="${imgUrl}" 
                alt="${product.name} angle ${index + 1}" 
                style="width: 100%; height: 100%; flex-shrink: 0; scroll-snap-align: start; object-fit: cover; display: block;" 
              />
            `).join('')}
          </div>
        </div>
      `;
    } else if (product.svg) {
      mediaContainer.style.padding = '2rem';
      mediaContainer.style.background = '#f4f5f7';
      mediaContainer.innerHTML = product.svg;
    }
  }

  // 3. Attach Add to Cart action button
  const addBtn = document.getElementById('add-to-cart-btn');
  if (addBtn) {
    addBtn.onclick = () => addToCart(product.id);
  }

  showView('product-detail');
}

// Cart Drawer Operations
function toggleCart() {
  const drawer = document.getElementById('cart-drawer');
  const overlay = document.getElementById('cart-overlay');
  if (drawer) drawer.classList.toggle('open');
  if (overlay) overlay.classList.toggle('open');
}

function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  if (!product) return;

  const existingItem = cart.find(item => String(item.id) === String(productId));
  if (existingItem) {
    existingItem.quantity += 1;
  } else {
    cart.push({ ...product, quantity: 1 });
  }

  updateCartUI();
  toggleCart();
}

function changeQuantity(productId, delta) {
  const item = cart.find(i => String(i.id) === String(productId));
  if (!item) return;

  item.quantity += delta;
  if (item.quantity <= 0) {
    cart = cart.filter(i => String(i.id) !== String(productId));
  }

  updateCartUI();
  if (document.getElementById('checkout-view')?.style.display === 'block') {
    renderCheckoutSummary();
  }
}

function updateCartUI() {
  const cartItemsContainer = document.getElementById('cart-items');
  const cartCountEl = document.getElementById('cart-count');
  const cartTotalEl = document.getElementById('cart-total');

  const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
  if (cartCountEl) cartCountEl.textContent = totalCount;

  if (cart.length === 0) {
    if (cartItemsContainer) cartItemsContainer.innerHTML = '<p style="color: #666; text-align: center; margin-top: 40px;">Your cart is empty.</p>';
    if (cartTotalEl) cartTotalEl.textContent = '$0.00';
    return;
  }

  let totalCost = 0;
  if (cartItemsContainer) {
    cartItemsContainer.innerHTML = cart.map(item => {
      const price = parseFloat(String(item.price).replace(/[^0-9.-]+/g, '')) || 0;
      totalCost += price * item.quantity;
      return `
        <div class="cart-item">
          <div>
            <h4 style="font-size: 0.95rem; color: #1D3156;">${item.name}</h4>
            <p style="font-size: 0.85rem; color: #666;">${item.price} × ${item.quantity}</p>
          </div>
          <div class="cart-item-qty">
            <button onclick="changeQuantity('${item.id}', -1)">-</button>
            <span>${item.quantity}</span>
            <button onclick="changeQuantity('${item.id}', 1)">+</button>
          </div>
        </div>
      `;
    }).join('');
  }

  if (cartTotalEl) cartTotalEl.textContent = `$${totalCost.toFixed(2)}`;
}

// Checkout Operations
function goToCheckout() {
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }
  const drawer = document.getElementById('cart-drawer');
  const overlay = document.getElementById('cart-overlay');
  if (drawer) drawer.classList.remove('open');
  if (overlay) overlay.classList.remove('open');

  showView('checkout');
}

function renderCheckoutSummary() {
  const summaryContainer = document.getElementById('checkout-summary-items');
  if (!summaryContainer) return;

  summaryContainer.innerHTML = cart.map(item => {
    const price = parseFloat(String(item.price).replace(/[^0-9.-]+/g, '')) || 0;
    const displayTotal = item.price === "TBD" ? "TBD" : `$${(price * item.quantity).toFixed(2)}`;
    return `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div>
          <p style="font-weight: 600; margin: 0; font-size: 0.9rem;">${item.name}</p>
          <p style="font-size: 0.8rem; color: #666; margin: 2px 0 0 0;">Qty: ${item.quantity} × ${item.price}</p>
        </div>
        <strong>${displayTotal}</strong>
      </div>
    `;
  }).join('');

  updateCheckoutTotals();
}

function updateCheckoutTotals() {
  let subtotal = 0;
  cart.forEach(item => {
    const price = parseFloat(String(item.price).replace(/[^0-9.-]+/g, '')) || 0;
    subtotal += price * item.quantity;
  });

  const shipping = parseFloat(document.querySelector('input[name="shipping"]:checked')?.value || 15);
  const grandTotal = subtotal + shipping;

  const subTotalEl = document.getElementById('co-subtotal');
  const shippingEl = document.getElementById('co-shipping');
  const grandTotalEl = document.getElementById('co-grand-total');

  if (subTotalEl) subTotalEl.textContent = `$${subtotal.toFixed(2)}`;
  if (shippingEl) shippingEl.textContent = `$${shipping.toFixed(2)}`;
  if (grandTotalEl) grandTotalEl.textContent = `$${grandTotal.toFixed(2)}`;
}

// Vercel Serverless Function Dispatch
async function handleFinalOrder(event) {
  event.preventDefault();

  const firstName = document.getElementById('co-first-name').value.trim();
  const lastName = document.getElementById('co-last-name').value.trim();
  const email = document.getElementById('co-email').value.trim();
  const phone = document.getElementById('co-phone').value.trim();
  const address = document.getElementById('co-address').value.trim();
  const city = document.getElementById('co-city').value;

  if (!firstName || !lastName || !email || !phone || !address || !city) {
    alert("Please fill in all required fields.");
    return;
  }

  const cleanPhone = phone.replace(/\D/g, '');
  if (cleanPhone.length !== 11) {
    alert("Please enter a valid 11-digit phone number (e.g. 07XXXXXXXXX).");
    return;
  }

  const fullName = `${firstName} ${lastName}`;
  const submitBtn = document.getElementById('place-order-btn');
  const orderMsgEl = document.getElementById('order-confirmation-message');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Processing Order...';
  if (orderMsgEl) orderMsgEl.style.display = 'none';

  const shippingCost = parseFloat(document.querySelector('input[name="shipping"]:checked')?.value || 15);

  let subtotal = 0;
  let itemsText = '';

  cart.forEach((item, i) => {
    const price = parseFloat(String(item.price).replace(/[^0-9.-]+/g, '')) || 0;
    const itemTotal = price * item.quantity;
    subtotal += itemTotal;

    const displayItemPrice = item.price === "TBD" ? "TBD" : `$${itemTotal.toFixed(2)}`;
    itemsText += `${i + 1}. ${item.name} (${item.material || item.tag || ''}) × ${item.quantity} — ${displayItemPrice}\n`;

    if (item.description) {
      const safeDesc = item.description.replace(/[_*`\[\]]/g, '').replace(/\n/g, ' ');
      itemsText += `    └ Details: ${safeDesc}\n`;
    }
  });

  const grandTotal = subtotal + shippingCost;

  try {
    const response = await fetch('/api/send-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: fullName,
        email,
        phone: cleanPhone,
        address,
        city,
        zip: '',
        itemsText,
        subtotal: subtotal.toFixed(2),
        shippingCost: shippingCost.toFixed(2),
        grandTotal: grandTotal.toFixed(2)
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || `Server returned status ${response.status}`);
    }

    cart = [];
    updateCartUI();
    document.getElementById('checkout-form').reset();

    if (orderMsgEl) {
      orderMsgEl.textContent = `Thank you ${firstName}! Your order has been placed successfully.`;
      orderMsgEl.style.display = 'block';
    }
  } catch (err) {
    console.error("Checkout Error:", err);
    alert(`Order Failed: ${err.message}`);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Complete Order & Pay';
  }
}

function handleSubscribe(event) {
  event.preventDefault();
  const emailInput = document.getElementById('email');
  const messageEl = document.getElementById('subscribe-message');
  if (emailInput && emailInput.value) {
    messageEl.textContent = `Thank you for subscribing!`;
    messageEl.style.display = 'block';
    emailInput.value = '';
    setTimeout(() => { messageEl.style.display = 'none'; }, 4000);
  }
}
